<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maureen Content Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: the deck's pages stacked as slides; page 14 is a live HTML slide with working carousels and videos.
     Single deliberate look: deck plum, matching the PDF. */
  :root {
    --ground: #170d1c;
    --plum: #24152b;
    --paper: #f7f2f8;
    --muted: #b7a9be;
    --lav: #cfa8ea;
    --line: #3e2a48;
    --serif: "Bodoni Moda", Didot, "Times New Roman", serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  body {
    background: var(--ground); color: var(--paper); font-family: var(--sans); font-weight: 300;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 48px;
  }
  .deck { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .bar {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
  }
  .bar b { font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: 0.3em; color: var(--paper); }
  .slide { position: relative; width: 100%; aspect-ratio: 11 / 8.5; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--plum); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .slide img.page { width: 100%; height: 100%; display: block; }
  .num { position: absolute; right: 10px; bottom: 8px; font-size: 10px; letter-spacing: 0.2em; color: rgba(247,242,248,0.45); }

  /* ---- live work-samples slide ---- */
  .live { aspect-ratio: auto; padding: clamp(18px, 4vw, 44px); display: flex; flex-direction: column; gap: 22px; }
  .live .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 14px;
    font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
  .live .top b { font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: 0.32em; color: var(--paper); }
  .live .eyebrow { text-align: center; font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--lav); }
  .live h2 { margin: -12px 0 0; text-align: center; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 3.6vw, 40px); text-wrap: balance; }
  .live h2 em { font-style: italic; }
  .live .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: -10px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .media { position: relative; width: 100%; max-width: 100%; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .media.c45 { aspect-ratio: 4 / 5; }
  .media.c916 { aspect-ratio: 9 / 16; }
  .scroller { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; overscroll-behavior-x: contain; }
  .scroller::-webkit-scrollbar { display: none; }
  .scroller img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; -webkit-user-drag: none; }
  .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(247,242,248,0.92); color: #24152b; display: grid; place-items: center; box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
  .nav svg { width: 12px; height: 12px; }
  .nav[disabled] { opacity: 0; pointer-events: none; }
  .prev { left: 8px; } .next { right: 8px; }
  .nav:focus-visible, .dot:focus-visible, .scroller:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }
  .dots { display: flex; justify-content: center; gap: 5px; min-height: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--line); }
  .dot[aria-current="true"] { background: var(--lav); }
  .kind { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--lav); }
  .card h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 17px; line-height: 1.2; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .scroller { scroll-behavior: auto; } }
</style>
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} img{max-width:100%}</style>
</head>
<body>

<div class="deck" id="deck">
  <div class="bar"><b>OLIVIA WEST</b><span>Content strategy for Maureen Kelly · scroll down</span></div>
</div>

<script>
  const deck = document.getElementById('deck');
  const LIVE_AT = 14, TOTAL = 15;
  const arrowL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg>';
  const arrowR = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg>';

  const ALT = {
    1: "Cover: Btw, it's cool to do both. Content strategy for Maureen Kelly.",
    2: 'The research: where Maureen is today.', 3: 'Five content pillars Maureen already lives in.',
    4: 'My ideas, mapped to her pillars.', 5: 'Why it will hit: the data behind the ideas.', 6: 'Why it will hit: the data, continued.',
    7: '12 Days of Tartemas recurring series.', 8: 'TikTok formats.', 9: 'Instagram: four carousels, one rhythm.',
    10: 'Cross-platform loop from TikTok to everywhere.', 11: "Maureen's Substack: her first season.",
    12: 'December content calendar, weeks 1 and 2.', 13: 'December content calendar, weeks 3 and 4.', 15: 'Sources.'
  };

  for (let n = 1; n <= TOTAL; n++) {
    if (n === LIVE_AT) { deck.appendChild(liveSlide()); continue; }
    const s = document.createElement('section');
    s.className = 'slide'; s.id = 'page-' + n;
    const pad = String(n).padStart(2, '0');
    s.innerHTML = `<img class="page" src="p-${pad}.jpg" alt="${ALT[n] || 'Page ' + n}" ${n > 2 ? 'loading="lazy"' : ''}>`;
    deck.appendChild(s);
  }

  function liveSlide() {
    const s = document.createElement('section');
    s.className = 'slide live'; s.id = 'page-14';
    s.innerHTML = `
      <div class="top"><span>Work Samples</span><b>OLIVIA WEST</b><span>14</span></div>
      <div class="eyebrow">Work Samples</div>
      <h2>Made for Maureen, <em>by me.</em></h2>
      <div class="hint">Swipe or tap the arrows on the carousels, and press play on the videos.</div>
      <div class="grid" id="grid"></div>`;
    const grid = s.querySelector('#grid');
    grid.appendChild(carousel('hands', 'Instagram carousel · 6 slides', 'Hills I Will Die On as a Beauty Founder',
      'Personal carousel: her founder lessons over photos from the early tarte days.', 6,
      ['Hills I will die on as a beauty founder', "You don't need everyone to believe in your vision. You just need to.",
       'Being a little delusional is a prerequisite for being an entrepreneur.', "The people you build with matter just as much as what you're building.",
       'tarte on the Oprah Magazine O List: the right person believing in your product can change everything.', "The best marketing doesn't feel like marketing."]));
    grid.appendChild(carousel('both', 'Instagram carousel · 5 slides', "Btw, It's Cool to Do Both",
      'Relatable carousel: CEO and fun, family and empire.', 5,
      ["Btw, it's cool to do both", 'Build a billion-dollar beauty brand and be the most unserious person in the office',
       'You can be the boss and still be one of the girls', 'You can raise a family and build a beauty empire',
       'You can take your business seriously without taking yourself too seriously']));
    grid.appendChild(video('trend', 'TikTok concept · 0:07', 'The Timestamp Trend',
      '9 am, 12 pm, 6 pm: glam, a shoot, then the trip.', 'timestamp.mp4', 'poster2.jpg', true));
    grid.appendChild(video('ditl', 'TikTok edit · 1:13', 'My Day-in-the-Life Edit',
      "Filmed, edited and captioned by me, the style I'd bring to her DIML.", 'ditl.mp4', 'poster.jpg', false));
    return s;
  }

  function carousel(id, kind, title, desc, n, alts) {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="media c45">
        <div class="scroller" tabindex="0" aria-label="${title} slides">
          ${alts.map((a, k) => `<img src="${id}-${k + 1}.jpg?v=2" alt="${a.replace(/"/g, '&quot;')}" draggable="false">`).join('')}
        </div>
        <button type="button" class="nav prev" id="${id}-prev" aria-label="Previous slide">${arrowL}</button>
        <button type="button" class="nav next" id="${id}-next" aria-label="Next slide">${arrowR}</button>
      </div>
      <div class="dots" role="tablist" aria-label="Choose slide"></div>
      <div class="kind">${kind}</div><h3>${title}</h3><p>${desc}</p>`;
    const sc = card.querySelector('.scroller'), prev = card.querySelector('.prev'), next = card.querySelector('.next');
    const dots = card.querySelector('.dots');
    let i = 0;
    for (let k = 0; k < n; k++) {
      const d = document.createElement('button');
      d.type = 'button'; d.className = 'dot'; d.id = id + '-dot-' + k; d.setAttribute('aria-label', 'Slide ' + (k + 1));
      d.addEventListener('click', () => go(k));
      dots.appendChild(d);
    }
    function render() {
      prev.disabled = i === 0; next.disabled = i === n - 1;
      [...dots.children].forEach((d, k) => d.setAttribute('aria-current', k === i ? 'true' : 'false'));
    }
    function go(m) { i = Math.max(0, Math.min(n - 1, m)); sc.scrollTo({ left: i * sc.clientWidth, behavior: 'smooth' }); render(); }
    sc.addEventListener('scroll', () => {
      const k = Math.round(sc.scrollLeft / Math.max(1, sc.clientWidth));
      if (k !== i) { i = Math.max(0, Math.min(n - 1, k)); render(); }
    }, { passive: true });
    sc.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(i + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(i - 1); }
    });
    window.addEventListener('resize', () => { sc.scrollLeft = i * sc.clientWidth; });
    prev.addEventListener('click', () => go(i - 1));
    next.addEventListener('click', () => go(i + 1));
    render();
    return card;
  }

  function video(id, kind, title, desc, src, poster, loop) {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="media c916"><video id="${id}-video" src="${src}" poster="${poster}" controls playsinline preload="metadata" ${loop ? 'loop' : ''}></video></div>
      <div class="dots" aria-hidden="true"></div>
      <div class="kind">${kind}</div><h3>${title}</h3><p>${desc}</p>`;
    return card;
  }
</script>

</body>
</html>
